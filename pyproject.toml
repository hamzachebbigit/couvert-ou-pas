[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "couvert-ou-pas"
version = "0.1.0"
description = "Un sinistre, des conditions générales, un verdict qui cite ses clauses et qui sait dire qu'il ne sait pas."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hamza Chebbi", email = "chebbihamzapfs@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "snowballstemmer>=2.2",
    "PyJWT[crypto]>=2.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ingest = ["docling>=2.0", "pymupdf>=1.24"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
